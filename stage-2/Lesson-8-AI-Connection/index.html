<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI Automation Demo</title>
  </head>
  <body>
    <textarea id="question" placeholder="Question to AI"></textarea>

    <br /><br />

    <button id="send">Send</button>

    <p id="result"></p>

    <script>
      const button = document.querySelector('#send');

      button.addEventListener('click', async () => {
        const question = document.querySelector('#question').value;

        try {
          const response = await fetch('http://localhost:3000/api/ai', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: question,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            document.querySelector('#result').innerHTML = `Error: ${data.error}`;
            return;
          }

          console.log(data);
          if (!data.success) {
            document.querySelector('#result').innerHTML = `Error: ${data.error}`;
          } else {
            document.querySelector('#result').innerHTML = `AI Response: 
            <br> Intent: ${data.reply.intent} <br> 
            Model: ${data.reply.model} 
            <br> Priority: ${data.reply.priority} 
            <br> Assigned Team: ${data.assignedTeam} 
            <br> Action: ${data.action}`;
          }
        } catch (error) {
          console.error('Error:', error);
          document.querySelector('#result').innerHTML = `Error: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
